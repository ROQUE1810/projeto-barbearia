<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acessar Agendamentos - Barbearia</title>
    <link rel="stylesheet" href="login.css"> 
</head>
<body>

    <div class="login-container">
        <h1>ENTRAR NO SISTEMA</h1>
        
        <form id="formLoginReal">
            <div class="form-group">
                <label for="emailLogin">Seu E-mail:</label>
                <input type="text" id="emailLogin" required placeholder="Digite o usuário (admin)"><!--é login 1234-->
            </div>
            
            <div class="form-group">
                <label for="senhaLogin">Sua Senha:</label>
                <input type="password" id="senhaLogin" required placeholder="Digite sua senha">
            </div>
            
            <button type="submit">Entrar</button>
        </form>
        
        <br>
        <p style="text-align: center;"><a href="main.html">Voltar para a Página Inicial</a></p>
    </div>

    <script src="login.js"></script>
</body>
</html>
