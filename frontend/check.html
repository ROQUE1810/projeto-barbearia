<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consultar Horário</title>
    <link rel="stylesheet" href="check.css">
</head>
<body>

    <div class="container">

        <h1>CONSULTE SEU HORÁRIO</h1>

        <!-- Mensagem amigável informando o e-mail logado -->
        <p style="text-align: center; color: #666;">
            Exibindo agendamentos para: <strong id="txtEmailLogado">...</strong>
        </p>

        <div class="resultado">
            <h2>Seu Agendamento</h2>

            <!-- Adicionamos IDs nos seus <p> para o JavaScript preencher dinamicamente -->
            <p><strong>Cliente:</strong> <span id="resCliente">Carregando...</span></p>
            <p><strong>Serviço:</strong> <span id="resServico">Carregando...</span></p>
            <p><strong>Barbeiro:</strong> <span id="resBarbeiro">Carregando...</span></p>
            <p><strong>Data e Hora:</strong> <span id="resDataHora">00/00/0000 às 00:00</span></p>
        </div>

        <br>
        <p style="text-align: center;"><a href="main.html">Voltar para a Página Inicial</a></p>

    </div>

    <script src="check.js"></script>

</body>
</html>
